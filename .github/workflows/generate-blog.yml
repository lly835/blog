name: Generate Blog from Bilibili Video

on:
  issues:
    types: [labeled]

jobs:
  generate:
    if: github.event.label.name == 'generate-blog'
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      issues: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt
      
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt
      
      - name: Generate blog post
        id: generate
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          BILIBILI_SESSDATA: ${{ secrets.BILIBILI_SESSDATA }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          cd scripts
          
          ISSUE_BODY=$(cat <<'EOF'
          ${{ github.event.issue.body }}
          EOF
          )
          
          OUTPUT=$(python main.py --message "$ISSUE_BODY" --notify 2>&1) || {
            echo "error=true" >> $GITHUB_OUTPUT
            echo "error_msg<<EOF" >> $GITHUB_OUTPUT
            echo "$OUTPUT" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            exit 1
          }
          
          echo "success=true" >> $GITHUB_OUTPUT
          
          FILEPATH=$(echo "$OUTPUT" | grep -o 'posts/[^"]*\.md' | head -1)
          echo "filepath=$FILEPATH" >> $GITHUB_OUTPUT
      
      - name: Commit and push
        if: steps.generate.outputs.success == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts/
          git diff --staged --quiet || git commit -m "Add generated blog post

          Closes #${{ github.event.issue.number }}"
          git push
      
      - name: Comment on issue (success)
        if: steps.generate.outputs.success == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const filepath = '${{ steps.generate.outputs.filepath }}';
            const fileUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/${filepath}`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### ✅ 博客已生成！\n\n📄 **文件**: [${filepath}](${fileUrl})\n\n博客已自动提交到仓库。`
            });
            
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
      
      - name: Comment on issue (failure)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const errorMsg = `${{ steps.generate.outputs.error_msg }}` || '未知错误';
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### ❌ 博客生成失败\n\n\`\`\`\n${errorMsg}\n\`\`\`\n\n请检查：\n1. Issue 内容是否包含有效的链接 (B站或文章)\n2. 仓库 Secrets 是否正确配置`
            });
      

